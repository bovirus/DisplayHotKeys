# Italian messages of Display Hot Keys, whose keys every other language's messages share. Each language words its
# messages naturally and follows its own punctuation, so only the keys and the numbered placeholders have to match.
#
# A message with a numbered placeholder such as {0} is filled in by java.text.MessageFormat, which treats an ASCII
# apostrophe as a quote, so translations of those messages use the typographic apostrophe ’ instead.
# A \n inside a message breaks it onto its own centered line in a dialog.
# The product name "Display Hot Keys" is never translated.

